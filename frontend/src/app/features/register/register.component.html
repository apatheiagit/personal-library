<div class="auth-container">
    <div class="auth-card">
    <h2 class="m-b-16">Регистрация</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <mat-form-field>
                <mat-label>Имя (опционально)</mat-label>
                <input
                    matInput
                    type="text"
                    id="name"
                    formControlName="name"
                    placeholder="Ваше имя"
                />
            </mat-form-field>
        </div>

        <div class="form-group">
            <mat-form-field>
                <mat-label>Email</mat-label>
                <input
                    matInput
                    required
                    type="email"
                    id="email"
                    formControlName="email"
                    placeholder="user@example.com"
                />
            </mat-form-field>
        </div>

        <div class="form-group">
            <mat-form-field>
                <mat-label>Пароль</mat-label>
                <input
                    matInput
                    required
                    [type]="hide() ? 'password' : 'text'"
                    id="password"
                    formControlName="password"
                    placeholder="••••••"
                />
                <button
                    matIconButton
                    matSuffix
                    type="button"
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide()"
                >
                    <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
        </div>

        <div class="form-group">
            <mat-form-field>
                <mat-label>Подтверждение пароля</mat-label>
                <input
                    matInput
                    required
                    [type]="hide() ? 'password' : 'text'"
                    id="confirmPassword"
                    formControlName="confirmPassword"
                    placeholder="••••••"                    
                />
                <button
                    matIconButton
                    matSuffix
                    type="button"
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide()"
                >
                    <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
        </div>

        <button
            matButton="filled"
            type="submit"
            class="btn-submit"
            [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Регистрация...' : 'Зарегистрироваться' }}
        </button>
    </form>

    <div class="auth-footer m-t-24">
        <p>Уже есть аккаунт? <a routerLink="/login">Войти</a></p>
    </div>
    </div>
</div>
