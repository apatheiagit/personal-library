<app-toast />
@if (authService.isLoggedIn$ | async) {
  <nav class="navbar">
    <div class="nav-brand">
      <img src="logo.svg" alt="Личная библиотека">
    </div>
    <div class="nav-links">
      <a routerLink="/books" routerLinkActive="active">Прочитанные</a>
      <a routerLink="/wishlist" routerLinkActive="active">Хочу прочитать</a>
      <a routerLink="/statistics" routerLinkActive="active">Статистика</a>
      <button class="btn-logout" (click)="authService.logout()">Выйти</button>
    </div>
    @if (authService.currentUser$ | async; as user) {
      <div class="user-info">
        <span>👤 {{ user.name || user.email }}</span>
      </div>
    }
  </nav>
}

<main class="container personal-library-container">
  <router-outlet></router-outlet>
</main>
