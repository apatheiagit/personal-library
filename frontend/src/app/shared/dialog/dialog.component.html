<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close (onClick)="close()">Нет</button>
  <button matButton mat-dialog-close cdkFocusInitial (onClick)="confirm()">Да</button>
</mat-dialog-actions>
