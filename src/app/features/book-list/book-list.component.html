<div class="book-list-container">
  <!-- Фильтры -->
  <div class="filters-panel">
    <h3>🔍 Фильтры</h3>
    <div class="filters-grid">
      <div class="filter-group">
        <label>По названию</label>
        <input 
          type="text" 
          [(ngModel)]="filters.searchTitle"
          (input)="onFilterChange()"
          placeholder="Название книги..."
        />
      </div>
      
      <div class="filter-group">
        <label>По автору</label>
        <input 
          type="text" 
          [(ngModel)]="filters.searchAuthor"
          (input)="onFilterChange()"
          placeholder="Фамилия автора..."
        />
      </div>
      
      <div class="filter-group">
        <label>По оценке</label>
        <select [(ngModel)]="filters.rating" (change)="onFilterChange()">
          <option [value]="undefined">Все оценки</option>
          <option [value]="5">⭐⭐⭐⭐⭐ (5)</option>
          <option [value]="4">⭐⭐⭐⭐ (4)</option>
          <option [value]="3">⭐⭐⭐ (3)</option>
          <option [value]="2">⭐⭐ (2)</option>
          <option [value]="1">⭐ (1)</option>
        </select>
      </div>
      
      <button class="btn-clear" (click)="clearFilters()">Сбросить фильтры</button>
    </div>
  </div>

  <!-- Кнопка добавления -->
  <div class="add-button-container">
    <button class="btn-add" routerLink="/book/add">+ Добавить книгу</button>
  </div>

  <!-- Список книг -->
  <div class="books-grid">
    <div *ngFor="let book of filteredBooks" class="book-card">
      <div class="book-header">
        <h3 class="book-title">{{ book.title }}</h3>
        <p class="book-author">{{ book.author }}</p>
        <p class="book-year" *ngIf="book.year">{{ book.year }}</p>
      </div>
      
      <div class="book-rating" *ngIf="book.rating">
        <span *ngFor="let star of getStarArray(book.rating)" class="star">⭐</span>
        <span class="rating-value">({{ book.rating }})</span>
      </div>
      
      <div class="book-review" *ngIf="book.personalReview">
        <p class="review-text">📝 "{{ book.personalReview | slice:0:100 }}{{ book.personalReview.length > 100 ? '...' : '' }}"</p>
      </div>
      
      <div class="book-actions">
        <button class="btn-edit" [routerLink]="['/book/edit', book.id]">✏️ Редактировать</button>
        <button class="btn-delete" (click)="deleteBook(book.id)">🗑️ Удалить</button>
        <button class="btn-move" (click)="moveToWishlist(book.id)">⟳ В Wishlist</button>
      </div>
    </div>
    
    <div *ngIf="filteredBooks.length === 0" class="empty-state">
      <p>📖 Нет книг в этом списке</p>
      <button routerLink="/book/add">Добавить первую книгу</button>
    </div>
  </div>
</div>
