<div class="wishlist-container">
  <div class="header">
    <h2>⭐ Список желаемых книг</h2>
    <button class="btn-add" routerLink="/book/add">+ Добавить книгу</button>
  </div>

  <div class="search-box">
    <input 
      type="text" 
      [(ngModel)]="searchTerm"
      (input)="applyFilter()"
      placeholder="🔍 Поиск по названию или автору..."
    />
  </div>

  <div class="books-grid">
    <div *ngFor="let book of filteredBooks" class="book-card">
      <div class="book-header">
        <h3>{{ book.title }}</h3>
        <p>{{ book.author }}</p>
        <small *ngIf="book.year">{{ book.year }}</small>
      </div>
      
      <div class="book-actions">
        <button class="btn-move" (click)="moveToRead(book.id)">📖 Прочитал(а)</button>
        <button class="btn-edit" [routerLink]="['/book/edit', book.id]">✏️</button>
        <button class="btn-delete" (click)="deleteBook(book.id)">🗑️</button>
      </div>
    </div>

    <div *ngIf="filteredBooks.length === 0" class="empty-state">
      <p>📚 Список желаний пуст</p>
      <button routerLink="/book/add">Добавить книгу</button>
    </div>
  </div>
</div>
