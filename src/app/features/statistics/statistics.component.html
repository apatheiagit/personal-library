<div class="statistics-container">
  <h2>📊 Статистика чтения</h2>
  
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value">{{ stats.totalRead }}</div>
      <div class="stat-label">Книг прочитано</div>
    </div>
    
    <div class="stat-card">
      <div class="stat-value">{{ stats.totalWishlist }}</div>
      <div class="stat-label">В списке желаний</div>
    </div>
    
    <div class="stat-card">
      <div class="stat-value">{{ stats.averageRating }}</div>
      <div class="stat-label">Средняя оценка</div>
    </div>
    
    <div class="stat-card">
      <div class="stat-value">{{ stats.totalBooks }}</div>
      <div class="stat-label">Всего книг</div>
    </div>
  </div>

  <div class="yearly-stats" *ngIf="getYearEntries().length > 0">
    <h3>Книги по годам издания</h3>
    <div class="year-bars">
      <div *ngFor="let item of getYearEntries()" class="year-bar">
        <div class="year-label">{{ item.year }}</div>
        <div class="bar-container">
          <div class="bar" [style.width.%]="(item.count / stats.totalRead) * 100"></div>
          <span class="count">{{ item.count }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="refresh-button">
    <button (click)="bookService.refresh()" class="btn-refresh">
      🔄 Обновить статистику
    </button>
  </div>
</div>
